<!-- Modal genérico de escolha de colormap -->
<div class="modal" id="cm-modal" aria-hidden="true">
  <div class="modal__overlay" data-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="cm-modal-title">
    <header class="modal__header">
      <h3 class="modal__title" id="cm-modal-title">Escolher colormap</h3>
      <button class="modal__close" type="button" aria-label="Fechar" data-close>&times;</button>
    </header>

    <div class="modal__content">
      <div class="cm-grid" id="cm-grid">
        <!-- Itens renderizados via JS -->
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn" type="button" data-close>Fechar</button>
    </footer>
  </div>
</div>
